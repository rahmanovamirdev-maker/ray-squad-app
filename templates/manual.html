<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мануал — LiamKing Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0066FF;
            --accent-blue: #00BFFF;
            --black: #000000;
            --light-gray: #8A92A6;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--white);
            background:
                radial-gradient(circle at top left, rgba(0, 102, 255, 0.18), transparent 34%),
                radial-gradient(circle at bottom right, rgba(0, 191, 255, 0.1), transparent 28%),
                var(--black);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .manual-placeholder {
            width: min(100%, 620px);
            border-radius: 28px;
            padding: 34px 28px;
            background: rgba(10, 14, 26, 0.82);
            border: 1px solid rgba(0, 102, 255, 0.24);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.34);
            text-align: center;
        }

        .manual-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            margin-bottom: 18px;
            border-radius: 999px;
            background: rgba(0, 102, 255, 0.12);
            border: 1px solid rgba(0, 191, 255, 0.18);
            color: #c6dcff;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .manual-icon {
            font-size: 3rem;
            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 2.8rem);
            line-height: 1;
            letter-spacing: -0.04em;
            margin-bottom: 12px;
        }

        p {
            color: var(--light-gray);
            font-size: 1rem;
            line-height: 1.6;
            max-width: 430px;
            margin: 0 auto;
        }

        .manual-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .manual-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
            padding: 12px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .manual-link.primary {
            background: linear-gradient(135deg, var(--primary-blue), #0047B3);
            color: var(--white);
            box-shadow: 0 14px 32px rgba(0, 102, 255, 0.28);
        }

        .manual-link.secondary {
            border: 1px solid rgba(0, 102, 255, 0.24);
            background: rgba(26, 31, 53, 0.55);
            color: var(--white);
        }

        .manual-link:hover {
            transform: translateY(-1px);
        }

        @media (max-width: 640px) {
            .manual-placeholder {
                padding: 28px 20px;
                border-radius: 22px;
            }

            .manual-actions {
                flex-direction: column;
            }

            .manual-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="manual-placeholder">
        <div class="manual-badge">Раздел закрыт</div>
        <div class="manual-icon">🛠️</div>
        <h1>Мануал в разработке</h1>
        <p>Этот раздел временно закрыт. Позже сюда вернётся обновлённый материал в более аккуратном и полезном виде.</p>
        <div class="manual-actions">
            <a href="{{ url_for('dashboard') }}" class="manual-link primary">Вернуться в анкеты</a>
            <a href="{{ url_for('index') }}" class="manual-link secondary">На главную</a>
        </div>
    </main>
</body>
</html>
